<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="46%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#351026"/>
      <stop offset="48%" stop-color="#1c0b19"/>
      <stop offset="100%" stop-color="#07070b"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="32%" stop-color="#f43f5e"/>
      <stop offset="68%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="rings" width="92" height="92" patternUnits="userSpaceOnUse">
      <circle cx="46" cy="46" r="1.8" fill="#fb7185" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="180" fill="url(#rings)"/>

  <!-- recursive relapse loop -->
  <g filter="url(#glow)" fill="none" stroke="url(#pulse)" stroke-linecap="round">
    <path d="M720 350C665 269 571 220 472 230c-142 15-250 136-250 279 0 84 37 161 99 213" stroke-width="48"/>
    <path d="M304 688l22 83-86-7" stroke-width="42" stroke-linejoin="round"/>
    <path d="M306 666c53 82 148 132 248 122 142-15 250-136 250-279 0-85-38-163-101-215" stroke-width="48"/>
    <path d="M720 335l-21-83 86 7" stroke-width="42" stroke-linejoin="round"/>
  </g>

  <!-- inner R monogram -->
  <g fill="none" stroke="url(#pulse)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M417 653V370h128c76 0 126 43 126 105 0 63-50 105-126 105H417" stroke-width="42"/>
    <path d="M544 578l139 125" stroke-width="42"/>
  </g>

  <circle cx="512" cy="512" r="250" fill="none" stroke="#f472b6" stroke-opacity=".12" stroke-width="3"/>
  <circle cx="512" cy="512" r="184" fill="#f43f5e" opacity=".035"/>
</svg>
