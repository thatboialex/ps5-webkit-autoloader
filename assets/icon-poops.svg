<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#160f08"/>
      <stop offset="55%" stop-color="#2a1707"/>
      <stop offset="100%" stop-color="#090806"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="35%" stop-color="#ffc247"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#a83d09"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#f59e0b" stroke-opacity=".055" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="180" fill="url(#grid)"/>
  <circle cx="512" cy="512" r="360" fill="#ff8a00" opacity=".055"/>
  <circle cx="512" cy="512" r="318" fill="none" stroke="#ff9f1c" stroke-opacity=".16" stroke-width="3"/>

  <!-- stylized exploit pipeline / P mark -->
  <g filter="url(#glow)" stroke="url(#gold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M338 704V316" stroke-width="54"/>
    <path d="M338 330H557c112 0 182 62 182 158s-70 158-182 158H421" stroke-width="54"/>
    <path d="M424 420H551c47 0 78 25 78 68s-31 68-78 68H424" stroke-width="26" opacity=".72"/>
  </g>

  <!-- packet nodes -->
  <g fill="#ffd166" stroke="#7c2d12" stroke-width="12">
    <circle cx="338" cy="316" r="24"/>
    <circle cx="338" cy="704" r="24"/>
    <circle cx="739" cy="488" r="24"/>
  </g>

  <!-- glitch cuts -->
  <g fill="#ffb627">
    <rect x="248" y="470" width="148" height="18" rx="9"/>
    <rect x="624" y="603" width="116" height="16" rx="8" opacity=".72"/>
    <rect x="676" y="355" width="92" height="14" rx="7" opacity=".56"/>
  </g>

  <!-- tiny status marks -->
  <g fill="#fff3c4">
    <rect x="278" y="778" width="82" height="14" rx="7" opacity=".78"/>
    <rect x="374" y="778" width="46" height="14" rx="7" opacity=".46"/>
    <rect x="434" y="778" width="112" height="14" rx="7" opacity=".28"/>
  </g>
</svg>
